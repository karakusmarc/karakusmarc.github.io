
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Marc Karakus Pérez — Yacht Designer and Design Engineer. Contemporary yacht design.">

    <title>Marc Karakus | Yacht Design</title>

    <style>

        /* ==========================================
           KARAKUS — OFFICIAL PORTFOLIO
           HOMEPAGE
           ========================================== */

        :root {
            --white: #f8f7f4;
            --font-editorial: Georgia, "Times New Roman", serif;
            --font-interface: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-interface);
            font-weight: 300;
            background: #1c2426;
            color: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* ==========================================
           FULLSCREEN HERO
           ========================================== */

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            min-height: 420px;
            overflow: hidden;
            isolation: isolate;
            background: #303c3f;
        }

        .hero-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            z-index: -2;
            pointer-events: none;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;

            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.22) 0%,
                rgba(0, 0, 0, 0.12) 35%,
                rgba(0, 0, 0, 0.27) 100%
            );

            z-index: -1;
            pointer-events: none;
        }


        /* ==========================================
           NAVIGATION
           ========================================== */

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;

            z-index: 10;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            padding: 32px 4%;
        }

        .brand {
            font-family: var(--font-editorial);
            font-size: 23px;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.2;
            white-space: nowrap;
        }

        .navigation {
            display: flex;
            gap: 35px;
            align-items: center;
            padding-top: 7px;
        }

        .navigation a {
            position: relative;

            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.12em;

            transition: opacity 0.35s ease;
        }

        .navigation a:hover {
            opacity: 0.55;
        }


        /* ==========================================
           HERO TYPOGRAPHY
           ========================================== */

        .hero-content {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 100px 24px 70px;
            pointer-events: none;
        }

        .hero-title {
            font-family: var(--font-editorial);

            font-size: clamp(65px, 10vw, 160px);
            font-weight: 400;
            line-height: 1;

            letter-spacing: 0.075em;
            padding-left: 0.075em;
        }

        .hero-subtitle {
            margin-top: 28px;

            font-family: var(--font-interface);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.3em;
            line-height: 1.8;
        }

        .hero-description {
            margin-top: 55px;
            max-width: 600px;

            font-family: var(--font-interface);
            font-size: 15px;
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.015em;
        }


        /* ==========================================
           RESPONSIVE — TABLET
           ========================================== */

        @media (max-width: 1000px) {

            .header {
                padding: 28px 5%;
            }

            .brand {
                font-size: 21px;
            }

            .navigation {
                gap: 25px;
            }

            .hero-title {
                font-size: clamp(60px, 11vw, 110px);
            }

        }


        /* ==========================================
           RESPONSIVE — MOBILE
           ========================================== */

        @media (max-width: 700px) {

            .hero {
                min-height: 500px;
            }

            .header {
                flex-direction: column;
                align-items: center;
                gap: 20px;

                padding: 26px 5%;
            }

            .brand {
                font-size: 21px;
            }

            .navigation {
                gap: 27px;
                padding-top: 0;
            }

            .navigation a {
                font-size: 10px;
                letter-spacing: 0.1em;
            }

            .hero-content {
                padding: 145px 22px 75px;
            }

            .hero-title {
                font-size: clamp(44px, 12vw, 80px);
                letter-spacing: 0.055em;
                padding-left: 0.055em;
            }

            .hero-subtitle {
                font-size: 9px;
                letter-spacing: 0.13em;
                margin-top: 22px;
            }

            .hero-description {
                margin-top: 38px;
                font-size: 13px;
                line-height: 1.9;
                max-width: 340px;
            }

            .hero-description br {
                display: none;
            }

        }


        /* ==========================================
           REDUCED MOTION
           ========================================== */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .navigation a {
                transition: none;
            }

        }

    </style>

</head>


<body>

    <main>

        <!-- ======================================
             HOMEPAGE VIDEO
             ====================================== -->

        <section class="hero">

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                poster="WEB/home/amiche.webp"
                aria-hidden="true">

                <source
                    src="WEB/home/hero.mp4"
                    type="video/mp4">

            </video>


            <!-- NAVIGATION -->

            <header class="header">

                <a class="brand" href="index.html">
                    Marc Karakus
                </a>

                <nav class="navigation"
                     aria-label="Main navigation">

                    <a href="projects.html">
                        PROJECTS
                    </a>

                    <a href="about.html">
                        ABOUT
                    </a>

                    <a href="mailto:karakusmarc@gmail.com">
                        CONTACT
                    </a>

                </nav>

            </header>


            <!-- MAIN TEXT -->

            <div class="hero-content">

                <h1 class="hero-title">
                    KARAKUS
                </h1>

                <p class="hero-subtitle">
                    YACHT DESIGNER | DESIGN ENGINEER
                </p>

                <p class="hero-description">
                    Inspired by the ocean, driven by curiosity,<br>
                    crafting yachts that blend art, innovation and soul.
                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================
         VIDEO ACCESSIBILITY
         ========================================== -->

    <script>

        const heroVideo = document.querySelector(
            ".hero-video"
        );

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        if (heroVideo && reducedMotion.matches) {
            heroVideo.pause();
            heroVideo.removeAttribute("autoplay");
        }

    </script>

</body>

</html>
