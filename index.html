
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Marc Karakus Pérez — Yacht Designer and Design Engineer.">

    <title>Marc Karakus | Yacht Design</title>

    <style>

        /* =====================================
           KARAKUS — HOMEPAGE
           Minimal Editorial Portfolio
        ===================================== */

        :root {
            --white: #f8f7f4;

            --serif: Georgia, "Times New Roman", serif;
            --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #303c3f;
            color: var(--white);

            font-family: var(--sans);
            font-weight: 300;

            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================
           FULLSCREEN CLICKABLE HOMEPAGE
        ===================================== */

        .hero-link {
            position: relative;

            display: block;

            width: 100%;
            height: 100vh;
            height: 100svh;

            min-height: 420px;

            overflow: hidden;
            isolation: isolate;

            background: #303c3f;

            cursor: pointer;
        }


        /* =====================================
           BACKGROUND VIDEO
        ===================================== */

        .hero-video {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: -2;

            pointer-events: none;
        }


        /* =====================================
           SUBTLE VIDEO OVERLAY
        ===================================== */

        .hero-link::before {
            content: "";

            position: absolute;
            inset: 0;

            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.18) 0%,
                rgba(0, 0, 0, 0.12) 40%,
                rgba(0, 0, 0, 0.24) 100%
            );

            z-index: -1;
            pointer-events: none;
        }


        /* =====================================
           BRAND — TOP LEFT
        ===================================== */

        .site-brand {
            position: absolute;

            top: 32px;
            left: 4%;

            z-index: 2;

            font-family: var(--serif);
            font-size: 23px;
            font-weight: 400;

            letter-spacing: 0.01em;
            line-height: 1.2;

            color: var(--white);
        }


        /* =====================================
           CENTERED CONTENT
        ===================================== */

        .hero-content {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 24px;
            color: var(--white);

            pointer-events: none;
        }

        .hero-title {
            font-family: var(--serif);

            font-size: clamp(65px, 10vw, 160px);
            font-weight: 400;

            line-height: 1;

            letter-spacing: 0.075em;
            padding-left: 0.075em;
        }

        .hero-subtitle {
            margin-top: 28px;

            font-family: var(--sans);

            font-size: 12px;
            font-weight: 300;

            letter-spacing: 0.3em;
            line-height: 1.8;
        }


        /* =====================================
           INTERACTION
        ===================================== */

        .hero-link:focus-visible {
            outline: 3px solid var(--white);
            outline-offset: -8px;
        }


        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 1000px) {

            .site-brand {
                top: 28px;
                left: 5%;
                font-size: 21px;
            }

            .hero-title {
                font-size: clamp(60px, 11vw, 110px);
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .hero-link {
                min-height: 500px;
            }

            .site-brand {
                top: 26px;
                left: 5%;

                font-size: 21px;
            }

            .hero-content {
                padding: 100px 20px;
            }

            .hero-title {
                font-size: clamp(44px, 12vw, 80px);

                letter-spacing: 0.055em;
                padding-left: 0.055em;
            }

            .hero-subtitle {
                font-size: 9px;

                letter-spacing: 0.13em;
                line-height: 1.8;

                margin-top: 22px;
            }

        }


        /* =====================================
           REDUCED MOTION
        ===================================== */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

        }

    </style>

</head>


<body>

    <main>

        <!-- =====================================
             FULLSCREEN CLICKABLE HERO
        ===================================== -->

        <a class="hero-link"
           href="projects.html"
           aria-label="Explore Marc Karakus yacht design projects">


            <!-- BACKGROUND VIDEO -->

            <video
                class="hero-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                poster="WEB/home/amiche.webp"
                aria-hidden="true">

                <source
                    src="WEB/home/hero.mp4"
                    type="video/mp4">

            </video>


            <!-- TOP LEFT BRAND -->

            <span class="site-brand">
                Marc Karakus
            </span>


            <!-- CENTERED TYPOGRAPHY -->

            <div class="hero-content">

                <h1 class="hero-title">
                    KARAKUS
                </h1>

                <p class="hero-subtitle">
                    YACHT DESIGNER | DESIGN ENGINEER
                </p>

            </div>


        </a>

    </main>


    <!-- =====================================
         ACCESSIBILITY
    ===================================== -->

    <script>

        const heroVideo = document.querySelector(
            ".hero-video"
        );

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        if (heroVideo && reducedMotion.matches) {

            heroVideo.pause();
            heroVideo.removeAttribute("autoplay");

        }

    </script>

</body>

</html>
