
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Selected yacht design projects by Marc Karakus Pérez.">

    <title>Projects | Marc Karakus</title>

    <style>

        /* =====================================
           KARAKUS — PROJECT INDEX
           Editorial Portfolio
        ===================================== */

        :root {
            --paper: #faf9f6;
            --ink: #292623;
            --muted: #aaa39d;

            --serif: Georgia, "Times New Roman", serif;
            --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            background: var(--paper);
            color: var(--ink);

            font-family: var(--serif);
            font-weight: 400;

            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
        }

        [hidden] {
            display: none !important;
        }


        /* =====================================
           FIXED HEADER
        ===================================== */

        .site-header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;

            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            padding: 22px 4%;

            background: var(--paper);
        }

        .site-brand {
            font-family: var(--serif);

            font-size: 23px;
            font-weight: 400;
            letter-spacing: 0.01em;
            line-height: 1.2;

            white-space: nowrap;
        }

        .site-navigation {
            display: flex;
            gap: 35px;

            padding-top: 7px;
        }

        .site-navigation a {
            font-family: var(--sans);

            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.12em;

            transition: opacity 0.3s ease;
        }

        .site-navigation a:hover {
            opacity: 0.5;
        }

        .site-navigation .current {
            border-bottom: 1px solid var(--ink);
            padding-bottom: 5px;
        }


        /* =====================================
           FIXED PROJECT MENU
        ===================================== */

        .project-menu {
            position: fixed;

            left: 4%;
            top: 80px;

            z-index: 90;

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            gap: 9px;
        }

        .project-menu a {
            display: block;

            font-family: var(--serif);

            font-size: 13px;
            font-weight: 400;
            line-height: 1.25;

            letter-spacing: 0.025em;

            color: var(--muted);

            transition: color 0.3s ease;
        }

        .project-menu a:hover {
            color: var(--ink);
        }

        .project-menu a.active {
            color: var(--ink);
            font-weight: 700;
        }


        /* =====================================
           FULLSCREEN PROJECT PANELS
        ===================================== */

        .project-panel {
            width: 100%;

            height: 100vh;
            height: 100svh;

            min-height: 560px;

            display: grid;

            grid-template-columns:
                minmax(155px, 19%)
                minmax(0, 1fr);

            column-gap: clamp(20px, 3vw, 60px);

            align-items: center;

            padding: 90px 4% 45px;

            scroll-snap-align: start;
            scroll-snap-stop: always;
        }


        /* =====================================
           IMAGE + INFORMATION COMPOSITION

           Both elements share one grid.
           Their bottom edges remain aligned.
        ===================================== */

        .project-stage {
            grid-column: 2;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(170px, 24%);

            column-gap: clamp(20px, 3vw, 60px);

            align-items: end;

            width: 100%;
        }


        /* =====================================
           CENTRAL PROJECT IMAGE
        ===================================== */

        .project-visual {
            grid-column: 1;

            display: block;

            width: 100%;

            cursor: pointer;
        }

        .image-frame {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .project-visual img {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 65vh;
            max-height: 65svh;

            object-fit: contain;
            object-position: center;

            transition: transform 0.9s
                cubic-bezier(0.22, 1, 0.36, 1);
        }

        .project-visual:hover img {
            transform: scale(1.015);
        }


        /* =====================================
           IMAGE PLACEHOLDER
        ===================================== */

        .image-frame.is-empty {
            min-height: 50vh;
            min-height: 50svh;

            background: #e8e5e0;
        }

        .image-fallback {
            font-family: var(--serif);

            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.08em;

            color: #aaa39a;
            text-align: center;
        }


        /* =====================================
           PROJECT INFORMATION

           Bottom aligned with the image
        ===================================== */

        .project-information {
            grid-column: 2;

            width: 100%;

            align-self: end;

            margin: 0;
            padding: 0;
        }

        .project-information h2 {
            font-family: var(--serif);

            font-size: 19px;
            font-weight: 400;
            letter-spacing: 0;

            line-height: 1.3;

            margin-bottom: 5px;
        }

        .project-category {
            font-family: var(--serif);

            font-size: 12px;
            font-weight: 400;

            letter-spacing: 0.015em;
            line-height: 1.5;

            color: var(--ink);
        }

        .project-link {
            display: inline-block;

            margin-top: 6px;

            font-family: var(--serif);

            font-size: 12px;
            font-weight: 400;

            letter-spacing: 0;

            color: var(--muted);

            transition: color 0.3s ease;
        }

        .project-link:hover {
            color: var(--ink);
        }


        /* =====================================
           TABLET
        ===================================== */

        @media (max-width: 1050px) {

            .project-panel {
                grid-template-columns:
                    minmax(125px, 18%)
                    minmax(0, 1fr);

                column-gap: 20px;
            }

            .project-stage {
                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(135px, 24%);

                column-gap: 20px;
            }

            .project-menu a {
                font-size: 12px;
            }

            .project-information h2 {
                font-size: 18px;
            }

            .project-category,
            .project-link {
                font-size: 11px;
            }

            .project-visual img {
                max-height: 58svh;
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .site-header {
                padding: 20px 5%;
                align-items: center;
            }

            .site-brand {
                font-size: 19px;
            }

            .site-navigation {
                gap: 15px;
                padding-top: 0;
            }

            .site-navigation a {
                font-size: 9px;
                letter-spacing: 0.04em;
            }


            /* Horizontal project menu */

            .project-menu {
                top: 65px;

                left: 0;
                right: 0;

                padding: 10px 5%;

                background: var(--paper);

                flex-direction: row;
                justify-content: space-between;
                align-items: center;

                gap: 8px;
            }

            .project-menu a {
                font-size: 11px;
                letter-spacing: 0.015em;
            }

            .project-menu a.active {
                font-weight: 700;
            }


            /* Mobile project composition */

            .project-panel {
                height: 100svh;
                min-height: 560px;

                grid-template-columns: 1fr;

                gap: 0;

                padding: 135px 6% 55px;
            }

            .project-stage {
                grid-column: 1;

                grid-template-columns: 1fr;
                grid-template-rows: auto auto;

                gap: 18px;

                align-items: center;
            }

            .project-visual {
                grid-column: 1;
                grid-row: 1;
            }

            .project-visual img {
                max-height: 47svh;
            }

            .image-frame.is-empty {
                min-height: 35svh;
            }

            .project-information {
                grid-column: 1;
                grid-row: 2;

                align-self: start;
            }

            .project-information h2 {
                font-size: 19px;
                margin-bottom: 5px;
            }

            .project-category {
                font-size: 11px;
            }

            .project-link {
                font-size: 11px;
                margin-top: 6px;
            }

        }


        /* =====================================
           REDUCED MOTION
        ===================================== */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .project-visual img,
            .project-menu a {
                transition: none;
            }

        }

    </style>

</head>


<body>

    <!-- =====================================
         PROJECT SCROLL NAVIGATION
    ===================================== -->

    <script>

        const panels = document.querySelectorAll(
            ".project-panel"
        );

        const menuLinks = document.querySelectorAll(
            ".project-menu a"
        );


        /* Update selected project */

        function setActiveProject(id) {

            menuLinks.forEach(link => {

                const isActive =
                    link.getAttribute("href") === "#" + id;

                link.classList.toggle(
                    "active",
                    isActive
                );

                if (isActive) {

                    link.setAttribute(
                        "aria-current",
                        "location"
                    );

                } else {

                    link.removeAttribute(
                        "aria-current"
                    );

                }

            });

        }


        /* Detect project during scrolling */

        const observer = new IntersectionObserver(

            entries => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        setActiveProject(
                            entry.target.id
                        );

                    }

                });

            },

            {
                threshold: 0.6
            }

        );


        panels.forEach(panel => {
            observer.observe(panel);
        });


        /* Project menu navigation */

        menuLinks.forEach(link => {

            link.addEventListener("click", () => {

                const id = link
                    .getAttribute("href")
                    .substring(1);

                setActiveProject(id);

            });

        });


        /* Fallback for missing images */

        document.querySelectorAll(
            ".image-frame"
        ).forEach(frame => {

            const image = frame.querySelector("img");

            const fallback = frame.querySelector(
                ".image-fallback"
            );

            function showFallback() {

                image.hidden = true;
                fallback.hidden = false;

                frame.classList.add("is-empty");

            }

            image.addEventListener(
                "error",
                showFallback
            );

            if (
                image.complete &&
                image.naturalWidth === 0
            ) {
                showFallback();
            }

        });

    </script>
